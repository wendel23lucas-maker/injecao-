<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calculadora de Produção — Injeção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14191E;
    --panel: #1D242B;
    --panel-raised: #232B33;
    --line: #2C363F;
    --text: #E8ECEF;
    --text-dim: #8B98A3;
    --text-faint: #5B6771;
    --yellow: #F2B705;
    --yellow-dim: #7A6317;
    --teal: #4FC3D9;
    --red: #E6483C;
    --red-dim: #3A2321;
    --gray-off: #6B7178;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* Header */
  .hdr{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--yellow);
  }
  .hdr-label{
    font-family:'Inter';
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .hdr h1{
    font-family: 'Barlow Condensed';
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 0.95;
    color: var(--text);
  }
  .hdr .count{
    font-family: 'JetBrains Mono';
    font-size: 12px;
    color: var(--text-faint);
    text-align: right;
    line-height: 1.5;
  }
  .hdr .count b{ color: var(--teal); font-size:14px; }

  /* Search */
  .search-box{
    position: relative;
    margin-bottom: 8px;
  }
  .search-box input{
    width: 100%;
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 14px 44px 14px 14px;
    font-family: 'JetBrains Mono';
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .search-box input::placeholder{ color: var(--text-faint); font-family:'Inter'; }
  .search-box input:focus{ border-color: var(--teal); }
  .search-icon{
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    pointer-events: none;
    font-size: 16px;
  }

  .hint{
    font-size: 12px;
    color: var(--text-faint);
    margin: 0 0 16px 2px;
  }

  /* Results dropdown */
  .results{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    margin-bottom: 18px;
    overflow: hidden;
    display: none;
  }
  .results.show{ display: block; }
  .result-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .result-row:last-child{ border-bottom: none; }
  .result-row:active{ background: var(--panel-raised); }
  .result-main{ min-width:0; }
  .result-item{
    font-family: 'JetBrains Mono';
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-sub{
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-rate{
    font-family: 'JetBrains Mono';
    font-size: 13px;
    color: var(--teal);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .no-results{
    padding: 16px 14px;
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
  }
  .badge{
    display:inline-block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .badge-inativo{ background: #33383D; color: var(--gray-off); }
  .badge-critico{ background: var(--red-dim); color: var(--red); }

  /* Selected part panel */
  .panel{
    display: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel.show{ display: block; }

  .panel-top{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title{
    font-family: 'Barlow Condensed';
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .panel-molde{
    font-family: 'JetBrains Mono';
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .panel-close{
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .stat-grid{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 4px;
  }
  .stat{
    background: var(--panel-raised);
    border-radius: 4px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat-val{
    font-family: 'JetBrains Mono';
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .stat-lbl{
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 3px;
    letter-spacing: .02em;
  }

  .rate-line{
    display:flex;
    align-items:baseline;
    justify-content: center;
    gap: 8px;
    margin: 16px 0 6px;
    padding: 12px;
    background: var(--panel-raised);
    border-radius: 4px;
    border-left: 3px solid var(--teal);
  }
  .rate-line .n{
    font-family: 'JetBrains Mono';
    font-size: 26px;
    font-weight: 700;
    color: var(--teal);
  }
  .rate-line .u{
    font-size: 13px;
    color: var(--text-dim);
  }

  .flag-line{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top: 10px;
    padding: 9px 11px;
    border-radius: 4px;
    font-size: 12.5px;
  }
  .flag-critico{ background: var(--red-dim); color: #FF8079; }
  .flag-inativo{ background: #262C31; color: var(--gray-off); }
  .flag-incompleto{ background: #2A2410; color: var(--yellow); }

  /* Calc section */
  .calc{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px;
    display: none;
  }
  .calc.show{ display:block; }
  .calc-label{
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .qty-row{
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .qty-row input{
    flex: 1;
    background: var(--panel-raised);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    font-family: 'JetBrains Mono';
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    outline: none;
    width: 100%;
  }
  .qty-row input:focus{ border-color: var(--yellow); }
  .quick-qty{
    display:flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .quick-qty button{
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'JetBrains Mono';
    font-size: 12px;
    padding: 6px 11px;
    border-radius: 3px;
    cursor: pointer;
  }
  .quick-qty button:active{ border-color: var(--yellow); color: var(--yellow); }

  .result-display{
    text-align: center;
    padding: 20px 10px 16px;
    border-top: 1px dashed var(--line);
  }
  .result-display .big{
    font-family: 'JetBrains Mono';
    font-size: 44px;
    font-weight: 700;
    color: var(--yellow);
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .result-display .unit{
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .result-display .alt{
    font-family: 'JetBrains Mono';
    font-size: 13px;
    color: var(--text-faint);
    margin-top: 10px;
  }
  .result-empty{
    text-align:center;
    color: var(--text-faint);
    font-size: 13px;
    padding: 10px 0 4px;
  }

  .empty-state{
    text-align: center;
    padding: 60px 20px;
    color: var(--text-faint);
  }
  .empty-state .glyph{
    font-family: 'JetBrains Mono';
    font-size: 34px;
    color: var(--line);
    margin-bottom: 10px;
  }
  .empty-state p{ font-size: 13px; line-height: 1.6; margin: 0; }

  ::selection{ background: var(--yellow-dim); }
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div>
      <div class="hdr-label">PAINEL DE PRODUÇÃO</div>
      <h1>Consulta de Molde</h1>
    </div>
    <div class="count">itens cadastrados<br><b id="totalCount">—</b></div>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Buscar peça ou molde (ex: TA-138, MP-005)" autocomplete="off">
    <span class="search-icon">⌕</span>
  </div>
  <div class="hint">Digite o código da peça (Item) ou do molde (ID Molde)</div>

  <div class="results" id="results"></div>

  <div class="panel" id="panel"></div>

  <div class="calc" id="calc">
    <div class="calc-label">Quantidade de peças a produzir</div>
    <div class="qty-row">
      <input id="qtyInput" type="number" inputmode="numeric" value="5000" min="1">
    </div>
    <div class="quick-qty">
      <button data-qty="1000">1.000</button>
      <button data-qty="2000">2.000</button>
      <button data-qty="5000">5.000</button>
      <button data-qty="10000">10.000</button>
      <button data-qty="20000">20.000</button>
    </div>
    <div id="resultDisplay"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="glyph">?</div>
    <p>Nenhuma peça selecionada.<br>Busque acima para ver cavidades,<br>ciclo e tempo de produção.</p>
  </div>

</div>

<script>
(function(){
  const searchInput = document.getElementById('searchInput');
  const resultsEl = document.getElementById('results');
  const panelEl = document.getElementById('panel');
  const calcEl = document.getElementById('calc');
  const emptyState = document.getElementById('emptyState');
  const qtyInput = document.getElementById('qtyInput');
  const resultDisplay = document.getElementById('resultDisplay');
  const totalCount = document.getElementById('totalCount');

  totalCount.textContent = MOLDES.length.toLocaleString('pt-BR');

  let selected = null;

  function piecesPerHour(row){
    if(!row.ciclo) return null;
    return row.ciclo;
  }

  function fmt(n, decimals){
    if(n === null || n === undefined || isNaN(n)) return '—';
    return n.toLocaleString('pt-BR', {minimumFractionDigits: decimals||0, maximumFractionDigits: decimals||0});
  }

  function statusBadge(row){
    if(row.status === 'INATIVO') return '<span class="badge badge-inativo">INATIVO</span>';
    if(row.status === 'CRÍTICO') return '<span class="badge badge-critico">CRÍTICO</span>';
    return '';
  }

  function doSearch(q){
    q = q.trim().toUpperCase();
    if(!q){
      resultsEl.classList.remove('show');
      resultsEl.innerHTML = '';
      return;
    }
    const matches = MOLDES.filter(r =>
      (r.item && r.item.toUpperCase().includes(q)) ||
      (r.molde && r.molde.toUpperCase().includes(q))
    ).slice(0, 40);

    if(matches.length === 0){
      resultsEl.innerHTML = '<div class="no-results">Nenhuma peça ou molde encontrado para "' + q.toLowerCase() + '"</div>';
      resultsEl.classList.add('show');
      return;
    }

    resultsEl.innerHTML = matches.map((r, i) => {
      const pph = piecesPerHour(r);
      return '<div class="result-row" data-idx="' + MOLDES.indexOf(r) + '">' +
        '<div class="result-main">' +
          '<div class="result-item">' + r.item + statusBadge(r) + '</div>' +
          '<div class="result-sub">Molde ' + r.molde + ' · ' + (r.cav_atual ?? '—') + ' cav</div>' +
        '</div>' +
        '<div class="result-rate">' + (pph ? fmt(pph,0)+'/h' : '—') + '</div>' +
      '</div>';
    }).join('');
    resultsEl.classList.add('show');
  }

  function selectRow(row){
    selected = row;
    resultsEl.classList.remove('show');
    searchInput.value = row.item;
    renderPanel(row);
    calculate();
  }

  function renderPanel(row){
    emptyState.style.display = 'none';
    const pph = piecesPerHour(row);

    let flags = '';
    if(row.status === 'CRÍTICO'){
      flags += '<div class="flag-line flag-critico">⚠ Molde marcado como CRÍTICO — atenção na operação</div>';
    }
    if(row.status === 'INATIVO'){
      flags += '<div class="flag-line flag-inativo">⏸ Molde INATIVO no cadastro atual</div>';
    }
    if(row.status === 'Não utilizar as opçoes'){
      flags += '<div class="flag-line flag-inativo">⛔ Não utilizar — conforme observação do cadastro</div>';
    }
    if(!pph){
      flags += '<div class="flag-line flag-incompleto">Dados incompletos: peças/hora não cadastrada para este item</div>';
    }

    panelEl.innerHTML =
      '<div class="panel-top">' +
        '<div>' +
          '<div class="panel-title">' + row.item + '</div>' +
          '<div class="panel-molde">Molde ' + row.molde + (row.tipo_mdo ? ' · ' + row.tipo_mdo : '') + '</div>' +
        '</div>' +
        '<button class="panel-close" id="closeBtn">✕</button>' +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="stat-val">' + (row.cav_atual ?? '—') + '</div><div class="stat-lbl">CAVIDADES</div></div>' +
        '<div class="stat"><div class="stat-val">' + (row.ciclo ?? '—') + '</div><div class="stat-lbl">PEÇAS/HORA</div></div>' +
        '<div class="stat"><div class="stat-val">' + (row.inj1 || '—') + '</div><div class="stat-lbl">INJETORA</div></div>' +
      '</div>' +
      '<div class="rate-line"><span class="n">' + (pph ? fmt(pph,0) : '—') + '</span><span class="u">peças / hora</span></div>' +
      flags;

    panelEl.classList.add('show');
    document.getElementById('closeBtn').addEventListener('click', reset);

    if(pph){
      calcEl.classList.add('show');
    } else {
      calcEl.classList.remove('show');
    }
  }

  function calculate(){
    if(!selected) return;
    const pph = piecesPerHour(selected);
    if(!pph) return;
    const qty = parseFloat(qtyInput.value) || 0;
    if(qty <= 0){
      resultDisplay.innerHTML = '<div class="result-empty">Informe uma quantidade válida</div>';
      return;
    }
    const hours = qty / pph;
    const totalMinutes = hours * 60;
    const h = Math.floor(hours);
    const m = Math.round((hours - h) * 60);
    const days8h = hours / 8;

    resultDisplay.innerHTML =
      '<div class="result-display">' +
        '<div class="big">' + fmt(hours, hours < 10 ? 2 : 1) + '</div>' +
        '<div class="unit">horas para produzir ' + fmt(qty,0) + ' peças</div>' +
        '<div class="alt">' + h + 'h' + String(m).padStart(2,'0') + 'min &nbsp;·&nbsp; ' + fmt(days8h,2) + ' turnos de 8h</div>' +
      '</div>';
  }

  function reset(){
    selected = null;
    searchInput.value = '';
    panelEl.classList.remove('show');
    panelEl.innerHTML = '';
    calcEl.classList.remove('show');
    resultsEl.classList.remove('show');
    resultsEl.innerHTML = '';
    resultDisplay.innerHTML = '';
    emptyState.style.display = 'block';
    searchInput.focus();
  }

  searchInput.addEventListener('input', (e) => doSearch(e.target.value));
  searchInput.addEventListener('focus', () => { if(searchInput.value) doSearch(searchInput.value); });

  resultsEl.addEventListener('click', (e) => {
    const row = e.target.closest('.result-row');
    if(!row) return;
    const idx = parseInt(row.dataset.idx, 10);
    selectRow(MOLDES[idx]);
  });

  qtyInput.addEventListener('input', calculate);
  document.querySelectorAll('.quick-qty button').forEach(btn => {
    btn.addEventListener('click', () => {
      qtyInput.value = btn.dataset.qty;
      calculate();
    });
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-box') && !e.target.closest('.results')){
      resultsEl.classList.remove('show');
    }
  });
})();
</script>
