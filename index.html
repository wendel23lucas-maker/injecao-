<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calculadora de Horas — Plasticomp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0a0e14;
    --bg-card:#131a24;
    --bg-card2:#1a2330;
    --border:#233043;
    --cyan:#00f2ff;
    --cyan-dim:rgba(0,242,255,0.12);
    --text:#e8eef5;
    --text-dim:#8fa3b8;
    --green:#3ddc84;
    --orange:#ffb84d;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh;}
  body{padding-bottom:40px;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, #0a0e14 80%, rgba(10,14,20,0));
    padding:18px 16px 10px;
  }
  header h1{
    margin:0; font-size:19px; font-weight:700; letter-spacing:0.2px;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan);}
  header .sub{font-size:12.5px; color:var(--text-dim); margin-top:2px;}

  .container{padding:0 16px; max-width:640px; margin:0 auto;}

  /* Upload screen */
  .upload-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px 24px; min-height:70vh;
  }
  .upload-screen .icon{font-size:48px; margin-bottom:16px;}
  .upload-screen h2{font-size:18px; margin:0 0 8px;}
  .upload-screen p{color:var(--text-dim); font-size:14px; margin:0 0 24px; line-height:1.5;}
  .upload-btn{
    background:var(--cyan); color:#04141a; font-weight:700; border:none;
    padding:14px 28px; border-radius:12px; font-size:15px; cursor:pointer;
    box-shadow:0 4px 20px rgba(0,242,255,0.25);
  }
  .upload-btn:active{transform:scale(0.97);}
  input[type=file]{display:none;}

  /* Search */
  .search-wrap{position:relative; margin:10px 0 14px;}
  .search-input{
    width:100%; padding:14px 44px 14px 16px; border-radius:14px;
    background:var(--bg-card); border:1px solid var(--border); color:var(--text);
    font-size:16px; font-family:var(--font); outline:none;
  }
  .search-input:focus{border-color:var(--cyan);}
  .search-icon{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none;}

  .suggestions{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    margin-top:6px; overflow:hidden; max-height:280px; overflow-y:auto;
  }
  .suggestion-item{
    padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .suggestion-item:last-child{border-bottom:none;}
  .suggestion-item:active{background:var(--bg-card2);}
  .suggestion-item .code{font-weight:700; font-size:14.5px;}
  .suggestion-badges{display:flex; gap:5px; flex-shrink:0;}
  .tag{
    font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; letter-spacing:0.3px;
  }
  .tag.inj{background:rgba(255,184,77,0.15); color:var(--orange);}
  .tag.linha{background:rgba(61,220,132,0.15); color:var(--green);}

  .empty-hint{color:var(--text-dim); font-size:13.5px; text-align:center; padding:30px 10px;}

  /* Qty input */
  .qty-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px;
  }
  .qty-card label{font-size:13px; color:var(--text-dim); white-space:nowrap;}
  .qty-card input{
    flex:1; background:var(--bg-card2); border:1px solid var(--border); border-radius:10px;
    color:var(--cyan); font-size:20px; font-weight:700; padding:10px 12px; outline:none;
    font-family:var(--font); text-align:right;
  }
  .qty-card input:focus{border-color:var(--cyan);}

  /* Result cards */
  .item-title{font-size:15px; font-weight:700; margin:4px 0 10px; display:flex; align-items:center; justify-content:space-between;}
  .item-title .clear-btn{font-size:12px; color:var(--text-dim); font-weight:400; cursor:pointer; text-decoration:underline;}

  .result-card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .result-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  }
  .result-card.inj::before{background:var(--orange);}
  .result-card.linha::before{background:var(--green);}

  .result-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
  .result-head .proc{font-size:11.5px; font-weight:700; letter-spacing:0.4px;}
  .result-card.inj .proc{color:var(--orange);}
  .result-card.linha .proc{color:var(--green);}
  .result-head .local{font-size:13px; color:var(--text-dim); margin-top:2px;}

  .grid-info{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-bottom:12px;}
  .info-item .k{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.3px;}
  .info-item .v{font-size:15px; font-weight:600; margin-top:2px;}

  .hours-box{
    background:var(--cyan-dim); border:1px solid rgba(0,242,255,0.3); border-radius:12px;
    padding:12px 14px; display:flex; justify-content:space-between; align-items:center;
    margin-top:4px;
  }
  .hours-box .k{font-size:12.5px; color:var(--text-dim);}
  .hours-box .v{font-size:22px; font-weight:800; color:var(--cyan);}
  .hours-box .v span{font-size:13px; font-weight:600; color:var(--text-dim); margin-left:4px;}

  .obs-line{font-size:12px; color:var(--text-dim); margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}

  .footer-bar{
    display:flex; justify-content:center; margin-top:20px;
  }
  .link-btn{
    background:none; border:none; color:var(--text-dim); font-size:12.5px;
    text-decoration:underline; cursor:pointer; font-family:var(--font);
  }

  .sync-badge{font-size:11px; color:var(--text-dim); text-align:center; margin-top:4px;}
</style>
</head>
<body>

<div id="uploadScreen" class="upload-screen" style="display:none;">
  <div class="icon">⏱️</div>
  <h2>Calculadora de Horas</h2>
  <p>Envie a planilha "Peças hora" (abas Linha de Montagem e Injetora) para começar. Ela fica salva neste celular — só precisa enviar de novo quando for atualizar.</p>
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Selecionar planilha</button>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <div id="uploadError" style="color:#ff6b6b; font-size:13px; margin-top:14px;"></div>
</div>

<div id="mainScreen" style="display:none;">
  <header>
    <h1><span class="dot"></span>Calculadora de Horas</h1>
    <div class="sub">Injeção e Linha de Montagem — Plasticomp</div>
  </header>

  <div class="container">
    <div class="search-wrap">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar item (ex: TA-138)" autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>

    <div id="suggestions" class="suggestions" style="display:none;"></div>
    <div id="emptyHint" class="empty-hint">Digite o código do item para buscar</div>

    <div id="resultsArea" style="display:none;">
      <div class="item-title">
        <span id="selectedItemLabel"></span>
        <span class="clear-btn" onclick="clearSelection()">trocar item</span>
      </div>

      <div class="qty-card">
        <label>Qtd. de peças</label>
        <input type="number" id="qtyInput" inputmode="numeric" placeholder="0" value="">
      </div>

      <div id="cardsContainer"></div>
    </div>

    <div class="footer-bar">
      <button class="link-btn" onclick="resetData()">🔄 Trocar planilha</button>
    </div>
    <div class="sync-badge" id="syncBadge"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'calc_horas_data_v1';
let DATA = { linha: [], injetora: [], updatedAt: null };
let selectedItem = null;

// ---------- Boot ----------
function boot(){
  const cached = localStorage.getItem(STORAGE_KEY);
  if(cached){
    try{
      DATA = JSON.parse(cached);
      showMain();
      return;
    }catch(e){ /* cai para os dados embutidos */ }
  }
  if(typeof EMBEDDED_DATA !== 'undefined' && EMBEDDED_DATA && (EMBEDDED_DATA.linha.length || EMBEDDED_DATA.injetora.length)){
    DATA = EMBEDDED_DATA;
    showMain();
  } else {
    showUpload();
  }
}

function showUpload(){
  document.getElementById('uploadScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display = 'none';
}
function showMain(){
  document.getElementById('uploadScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
  const badge = document.getElementById('syncBadge');
  if(DATA.updatedAt){
    const d = new Date(DATA.updatedAt);
    badge.textContent = '💾 Planilha carregada em ' + d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
}

function resetData(){
  if(confirm('Isso vai apagar a planilha carregada neste celular. Continuar?')){
    localStorage.removeItem(STORAGE_KEY);
    DATA = { linha: [], injetora: [], updatedAt: null };
    clearSelection();
    document.getElementById('searchInput').value = '';
    showUpload();
  }
}

// ---------- File parsing ----------
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      parseWorkbook(wb);
    }catch(err){
      document.getElementById('uploadError').textContent = 'Erro ao ler o arquivo: ' + err.message;
    }
  };
  reader.readAsArrayBuffer(file);
});

function findSheetName(wb, candidates){
  const names = wb.SheetNames;
  for(const cand of candidates){
    const found = names.find(n => n.toLowerCase().includes(cand.toLowerCase()));
    if(found) return found;
  }
  return null;
}

function parseWorkbook(wb){
  const linhaSheetName = findSheetName(wb, ['linha de montagem', 'montagem']);
  const injSheetName = findSheetName(wb, ['injetora', 'injeç']);

  let linha = [];
  let injetora = [];

  if(linhaSheetName){
    const ws = wb.Sheets[linhaSheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    // header expected at row 0: CÉLULA, ITEM, MDO MIN, MDO MAX, PC/HR, SEGMENTO, CÉLULA REAL
    for(let i=1; i<rows.length; i++){
      const r = rows[i];
      if(!r || !r[1]) continue;
      linha.push({
        celula: r[0] ?? '',
        item: String(r[1]).trim(),
        mdoMin: numOrNull(r[2]),
        mdoMax: numOrNull(r[3]),
        pcHr: numOrNull(r[4]),
        segmento: r[5] ?? '',
        celulaReal: r[6] ?? r[0] ?? ''
      });
    }
  }

  if(injSheetName){
    const ws = wb.Sheets[injSheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    // find header row (contains 'Item' in col A, usually row index 2)
    let headerIdx = rows.findIndex(r => r && String(r[0]).trim().toLowerCase() === 'item');
    if(headerIdx === -1) headerIdx = 2;
    for(let i=headerIdx+1; i<rows.length; i++){
      const r = rows[i];
      if(!r || !r[0]) continue;
      injetora.push({
        item: String(r[0]).trim(),
        idMolde: r[1] ?? '',
        cavOriginal: numOrNull(r[2]),
        cavAtual: numOrNull(r[3]),
        pcHr: numOrNull(r[4]),
        tipoMdo: r[5] ?? '',
        injetora1: r[6] ?? '',
        injetora2: r[7] ?? '',
        injetora3: r[8] ?? '',
        status: r[9] ?? '',
        obs: r[10] ?? '',
        troca: r[11] ?? ''
      });
    }
  }

  DATA = { linha, injetora, updatedAt: Date.now() };
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  }catch(e){
    console.warn('Não foi possível salvar cache local', e);
  }
  showMain();
}

function numOrNull(v){
  if(v === null || v === undefined || v === '') return null;
  const n = parseFloat(String(v).replace(',','.'));
  return isNaN(n) ? null : n;
}

// ---------- Search ----------
function getAllItemCodes(){
  const set = new Set();
  DATA.linha.forEach(r => set.add(r.item));
  DATA.injetora.forEach(r => set.add(r.item));
  return Array.from(set);
}

function itemHasInj(code){ return DATA.injetora.some(r => r.item === code); }
function itemHasLinha(code){ return DATA.linha.some(r => r.item === code); }

document.getElementById('searchInput').addEventListener('input', function(e){
  const q = e.target.value.trim().toUpperCase();
  const sugBox = document.getElementById('suggestions');
  const hint = document.getElementById('emptyHint');
  if(!q){
    sugBox.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = 'Digite o código do item para buscar';
    return;
  }
  const all = getAllItemCodes();
  const matches = all.filter(code => code.toUpperCase().includes(q)).sort().slice(0, 30);
  if(matches.length === 0){
    sugBox.style.display = 'none';
    hint.style.display = 'block';
    hint.textContent = 'Nenhum item encontrado';
    return;
  }
  hint.style.display = 'none';
  sugBox.style.display = 'block';
  sugBox.innerHTML = matches.map(code => {
    let badges = '';
    if(itemHasInj(code)) badges += '<span class="tag inj">INJEÇÃO</span>';
    if(itemHasLinha(code)) badges += '<span class="tag linha">LINHA</span>';
    return `<div class="suggestion-item" onclick="selectItem('${escapeJs(code)}')">
              <span class="code">${escapeHtml(code)}</span>
              <span class="suggestion-badges">${badges}</span>
            </div>`;
  }).join('');
});

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeJs(s){ return String(s).replace(/'/g, "\\'"); }

function selectItem(code){
  selectedItem = code;
  document.getElementById('suggestions').style.display = 'none';
  document.getElementById('emptyHint').style.display = 'none';
  document.getElementById('searchInput').value = code;
  document.getElementById('selectedItemLabel').textContent = code;
  document.getElementById('resultsArea').style.display = 'block';
  document.getElementById('qtyInput').value = '';
  renderCards();
}

function clearSelection(){
  selectedItem = null;
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').focus();
  document.getElementById('emptyHint').style.display = 'block';
  document.getElementById('emptyHint').textContent = 'Digite o código do item para buscar';
}

document.getElementById('qtyInput').addEventListener('input', renderCards);

function renderCards(){
  if(!selectedItem) return;
  const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
  const container = document.getElementById('cardsContainer');
  let html = '';

  const injRows = DATA.injetora.filter(r => r.item === selectedItem);
  const linhaRows = DATA.linha.filter(r => r.item === selectedItem);

  injRows.forEach(r => {
    const horas = (qty > 0 && r.pcHr) ? qty / r.pcHr : null;
    const maquinas = [r.injetora1, r.injetora2, r.injetora3].filter(v => v !== '' && v !== null && v !== undefined).join(' / ');
    html += `
      <div class="result-card inj">
        <div class="result-head">
          <div>
            <div class="proc">INJEÇÃO${r.status ? ' · ' + escapeHtml(String(r.status)) : ''}</div>
            <div class="local">${maquinas ? 'Máquina: ' + escapeHtml(maquinas) : 'Máquina não informada'}</div>
          </div>
        </div>
        <div class="grid-info">
          <div class="info-item"><div class="k">Peças / hora</div><div class="v">${r.pcHr ?? '—'}</div></div>
          <div class="info-item"><div class="k">Cavidades</div><div class="v">${r.cavAtual ?? r.cavOriginal ?? '—'}</div></div>
          <div class="info-item"><div class="k">Molde</div><div class="v">${escapeHtml(r.idMolde || '—')}</div></div>
          <div class="info-item"><div class="k">Tipo MDO</div><div class="v">${escapeHtml(r.tipoMdo || '—')}</div></div>
        </div>
        <div class="hours-box">
          <span class="k">Horas necessárias</span>
          <span class="v">${horas !== null ? formatHoras(horas) : '—'}<span>${horas !== null ? 'h' : ''}</span></span>
        </div>
        ${r.obs && r.obs !== '-' ? `<div class="obs-line">Obs: ${escapeHtml(r.obs)}${r.troca && r.troca !== '-' ? ' · Troca: ' + escapeHtml(r.troca) : ''}</div>` : ''}
      </div>`;
  });

  linhaRows.forEach(r => {
    const horas = (qty > 0 && r.pcHr) ? qty / r.pcHr : null;
    const mdoLabel = (r.mdoMin !== null && r.mdoMax !== null)
      ? (r.mdoMin === r.mdoMax ? r.mdoMin : `${r.mdoMin} a ${r.mdoMax}`)
      : (r.mdoMin ?? r.mdoMax ?? '—');
    html += `
      <div class="result-card linha">
        <div class="result-head">
          <div>
            <div class="proc">LINHA DE MONTAGEM${r.segmento ? ' · ' + escapeHtml(String(r.segmento)) : ''}</div>
            <div class="local">Célula: ${escapeHtml(String(r.celulaReal || r.celula || '—'))}</div>
          </div>
        </div>
        <div class="grid-info">
          <div class="info-item"><div class="k">Peças / hora</div><div class="v">${r.pcHr ?? '—'}</div></div>
          <div class="info-item"><div class="k">MDO</div><div class="v">${mdoLabel}</div></div>
        </div>
        <div class="hours-box">
          <span class="k">Horas necessárias</span>
          <span class="v">${horas !== null ? formatHoras(horas) : '—'}<span>${horas !== null ? 'h' : ''}</span></span>
        </div>
      </div>`;
  });

  if(injRows.length === 0 && linhaRows.length === 0){
    html = `<div class="empty-hint">Item não encontrado nas planilhas carregadas.</div>`;
  }

  container.innerHTML = html;
}

function formatHoras(h){
  if(h < 0.01) return '0,00';
  return h.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

boot();
</script>
</body>
</html>
